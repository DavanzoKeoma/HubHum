name: Nightly Programmatic SEO Builder & Instant Translator

on:
  schedule:
    # 4 staggered daily waves targeting 1,000 pages/day within Gemini 1,500 RPD ceiling
    # (01:00 UTC -> 250 Tier 1 | 03:00 UTC -> 250 Tier 1 | 05:00 UTC -> 250 Tier 2 | 07:00 UTC -> 50 Tier 2 + 200 Tier 3)
    - cron: "0 1,3,5,7 * * *"
  repository_dispatch:
    types: [translate-app, translate_app]
  issues:
    types: [opened, labeled]
  workflow_dispatch:
    inputs:
      repo_url:
        description: "Optional single GitHub repository URL to translate"
        required: false
        type: string
      repo_urls:
        description: "Comma-separated GitHub repository URLs (bypasses star filter)"
        required: false
        type: string
      tier:
        description: "Scouting tier when converting in batch (all | tier1 | tier2 | tier3 | trending)"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - tier1
          - tier2
          - tier3
          - trending
      force_provider:
        description: "AI provider (auto | gemini | groq | both)"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - gemini
          - groq
          - both
      limit:
        description: "Maximum apps to convert in this wave (250/wave = 1,000/day)"
        required: false
        default: "250"
        type: string

permissions:
  contents: write
  issues: write

jobs:
  run-seo-pipeline:
    if: |
      github.event_name != 'issues' ||
      contains(github.event.issue.labels.*.name, 'hubhum-translate') ||
      contains(github.event.issue.labels.*.name, 'translate-request')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Determine wave partition for 1,000/day Tier quota
        id: wave
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            UTC_HOUR=$(date -u +%H)
            echo "UTC hour: ${UTC_HOUR}"
            case "${UTC_HOUR}" in
              01|02)
                echo "mode=wave1" >> "$GITHUB_OUTPUT"
                echo "tier=tier1" >> "$GITHUB_OUTPUT"
                echo "limit=250" >> "$GITHUB_OUTPUT"
                ;;
              03|04)
                echo "mode=wave2" >> "$GITHUB_OUTPUT"
                echo "tier=tier1" >> "$GITHUB_OUTPUT"
                echo "limit=250" >> "$GITHUB_OUTPUT"
                ;;
              05|06)
                echo "mode=wave3" >> "$GITHUB_OUTPUT"
                echo "tier=tier2" >> "$GITHUB_OUTPUT"
                echo "limit=250" >> "$GITHUB_OUTPUT"
                ;;
              *)
                echo "mode=wave4_split" >> "$GITHUB_OUTPUT"
                echo "tier=all" >> "$GITHUB_OUTPUT"
                echo "limit=250" >> "$GITHUB_OUTPUT"
                ;;
            esac
          else
            echo "mode=manual_or_ondemand" >> "$GITHUB_OUTPUT"
            echo "tier=${{ github.event.inputs.tier || 'all' }}" >> "$GITHUB_OUTPUT"
            echo "limit=${{ github.event.inputs.limit || '250' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository with HUBHUM_PAT (enables deploy.yml chaining)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.HUBHUM_PAT }}
          fetch-depth: 10

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure Git author for atomic 50-card checkpoint commits
        run: |
          git config user.name "DavanzoKeoma"
          git config user.email "keomadavanzo@gmail.com"

      - name: Extract target URL from Issue or Dispatch payload
        id: extract
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_BODY: ${{ github.event.issue.body || '' }}
          ISSUE_TITLE: ${{ github.event.issue.title || '' }}
          DIRECT_URL: ${{ github.event.client_payload.repo_url || github.event.inputs.repo_url || '' }}
        run: |
          python3 - <<'PY'
          import os, re
          ev = os.environ.get("EVENT_NAME", "")
          url = os.environ.get("DIRECT_URL", "").strip()
          if ev == "issues" and not url:
              combined = f"{os.environ.get('ISSUE_TITLE', '')}\n{os.environ.get('ISSUE_BODY', '')}"
              m = re.search(r"https?://github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", combined)
              if m:
                  url = m.group(0).rstrip(".,;)")
          slug = ""
          if url:
              slug = re.sub(r"[^a-z0-9-]+", "-", url.rstrip("/").split("/")[-1].lower()).strip("-")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"repo_url={url}\n")
              fh.write(f"slug={slug}\n")
          PY

      - name: Run 3-Tier Scouting & 2-Tier AI Translation Pipeline (Gemini -> Groq)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.HUBHUM_PAT || secrets.GITHUB_TOKEN }}
          DISPATCH_REPO_URL: ${{ steps.extract.outputs.repo_url }}
          DISPATCH_REPO_URLS: ${{ github.event.client_payload.repo_urls || github.event.inputs.repo_urls || '' }}
          FORCE_PROVIDER: ${{ github.event.inputs.force_provider || 'auto' }}
          WAVE_MODE: ${{ steps.wave.outputs.mode }}
          SCOUT_TIER: ${{ steps.wave.outputs.tier }}
          SCOUT_LIMIT: ${{ steps.wave.outputs.limit }}
        run: |
          if [ -n "${DISPATCH_REPO_URLS}" ]; then
            python3 scripts/seo_pipeline.py --repo-urls "${DISPATCH_REPO_URLS}" --force-provider "${FORCE_PROVIDER}" --min-delay 4.1
          elif [ -n "${DISPATCH_REPO_URL}" ]; then
            python3 scripts/seo_pipeline.py --single-repo "${DISPATCH_REPO_URL}" --force-provider "${FORCE_PROVIDER}" --min-delay 0
          elif [ "${WAVE_MODE}" = "wave4_split" ]; then
            python3 scripts/seo_pipeline.py --tier tier2 --limit 50 --force-provider "${FORCE_PROVIDER}" --batch-commit-size 50 --auto-git-push --min-delay 4.1
            python3 scripts/seo_pipeline.py --tier tier3 --limit 200 --force-provider "${FORCE_PROVIDER}" --batch-commit-size 50 --auto-git-push --min-delay 4.1
          else
            AUTO_PUSH_FLAG=""
            if [ "${{ github.event_name }}" = "schedule" ]; then
              AUTO_PUSH_FLAG="--auto-git-push"
            fi
            python3 scripts/seo_pipeline.py --tier "${SCOUT_TIER}" --limit "${SCOUT_LIMIT}" --force-provider "${FORCE_PROVIDER}" --batch-commit-size 50 ${AUTO_PUSH_FLAG} --min-delay 4.1
          fi
          python3 scripts/generate_catalog_index.py

      - name: Validate all Markdown cards
        run: python3 scripts/validator_sanitizer.py --check-all

      - name: Commit and push remaining batch cards
        run: |
          git add content/apps public/icons public/catalog-index.json data/catalog-index.json data/retry_queue.json
          if git diff --cached --quiet; then
            echo "No remaining un-committed cards."
          else
            git commit -m "chore(seo): update HubHum app cards and catalog index"
            git pull --rebase origin main || true
            git push origin main
          fi

      - name: Comment and close translation Issue on completion
        if: github.event_name == 'issues' && steps.extract.outputs.slug != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          APP_SLUG: ${{ steps.extract.outputs.slug }}
        run: |
          gh issue comment "${ISSUE_NUMBER}" --body "App successfully translated! Available at: https://davanzokeoma.github.io/HubHum/apps/${APP_SLUG}/"
          gh issue close "${ISSUE_NUMBER}" --reason completed
