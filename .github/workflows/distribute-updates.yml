name: Distribute HubHum Guide Updates (Opt-In)

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Optional guide or bundle slug to share (defaults to primary pillar)"
        required: false
        default: ""
      dry_run:
        description: "Dry-run mode without external API posts"
        required: false
        type: boolean
        default: false
  release:
    types: [published]
  push:
    branches: ["main"]
    paths:
      - "content/guides/**"
      - "content/bundles/**"

permissions:
  contents: read

jobs:
  distribute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run opt-in content distribution script
        env:
          DISTRIBUTE_SLUG: ${{ github.event.inputs.slug || '' }}
          DISTRIBUTE_DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          DEVTO_PUBLISH: ${{ vars.DEVTO_PUBLISH || 'false' }}
          HASHNODE_TOKEN: ${{ secrets.HASHNODE_TOKEN }}
          HASHNODE_PUB_ID: ${{ secrets.HASHNODE_PUB_ID }}
          MASTODON_INSTANCE_URL: ${{ secrets.MASTODON_INSTANCE_URL }}
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scripts/distribute_updates.py
