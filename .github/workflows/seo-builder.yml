name: Nightly Programmatic SEO Builder & Instant Translator

on:
  schedule:
    # Multiple daily catch-up windows resilient to GitHub free-tier cron delays/skips
    - cron: "0 1,3,5,7,11,15,19,23 * * *"
  repository_dispatch:
    types: [translate-app, translate_app]
  issues:
    types: [opened, labeled]
  workflow_dispatch:
    inputs:
      repo_url:
        description: "Optional single GitHub repository URL to translate"
        required: false
        type: string
      repo_urls:
        description: "Comma-separated GitHub repository URLs (bypasses star filter)"
        required: false
        type: string
      tier:
        description: "Scouting tier when converting in batch (all | tier1 | tier2 | tier3 | trending)"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - tier1
          - tier2
          - tier3
          - trending
      count:
        description: "Number of new cards to generate (overrides limit if set)"
        required: false
        default: ""
        type: string
      force_provider:
        description: "AI provider (auto | gemini | groq | both)"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - gemini
          - groq
          - both
      limit:
        description: "Maximum apps to convert in this wave (250/wave = 1,000/day)"
        required: false
        default: "250"
        type: string

permissions:
  contents: write
  issues: write

jobs:
  run-seo-pipeline:
    if: |
      github.event_name != 'issues' ||
      contains(github.event.issue.labels.*.name, 'hubhum-translate') ||
      contains(github.event.issue.labels.*.name, 'translate-request')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Determine quota-aware wave allocation
        id: wave
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            UTC_HOUR=$(date -u +%H)
            echo "UTC hour: ${UTC_HOUR}"
            echo "mode=quota_adaptive" >> "$GITHUB_OUTPUT"
            echo "tier=all" >> "$GITHUB_OUTPUT"
            echo "limit=125" >> "$GITHUB_OUTPUT"
          else
            echo "mode=manual_or_ondemand" >> "$GITHUB_OUTPUT"
            echo "tier=${{ github.event.inputs.tier || 'all' }}" >> "$GITHUB_OUTPUT"
            echo "limit=${{ github.event.inputs.count || github.event.inputs.limit || '250' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository with HUBHUM_PAT (enables deploy.yml chaining)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.HUBHUM_PAT }}
          fetch-depth: 10

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure Git author for atomic 50-card checkpoint commits
        run: |
          git config user.name "DavanzoKeoma"
          git config user.email "keomadavanzo@gmail.com"

      - name: Extract target URL from Issue or Dispatch payload
        id: extract
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_BODY: ${{ github.event.issue.body || '' }}
          ISSUE_TITLE: ${{ github.event.issue.title || '' }}
          DIRECT_URL: ${{ github.event.client_payload.repo_url || github.event.inputs.repo_url || '' }}
        run: |
          python3 - <<'PY'
          import os, re
          ev = os.environ.get("EVENT_NAME", "")
          url = os.environ.get("DIRECT_URL", "").strip()
          if ev == "issues" and not url:
              combined = f"{os.environ.get('ISSUE_TITLE', '')}\n{os.environ.get('ISSUE_BODY', '')}"
              m = re.search(r"https?://github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", combined)
              if m:
                  url = m.group(0).rstrip(".,;)")
          slug = ""
          if url:
              slug = re.sub(r"[^a-z0-9-]+", "-", url.rstrip("/").split("/")[-1].lower()).strip("-")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"repo_url={url}\n")
              fh.write(f"slug={slug}\n")
          PY

      - name: Run 3-Tier Scouting & 2-Tier AI Translation Pipeline (Gemini -> Groq)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.HUBHUM_PAT || secrets.GITHUB_TOKEN }}
          DISPATCH_REPO_URL: ${{ steps.extract.outputs.repo_url }}
          DISPATCH_REPO_URLS: ${{ github.event.client_payload.repo_urls || github.event.inputs.repo_urls || '' }}
          FORCE_PROVIDER: ${{ github.event.inputs.force_provider || 'auto' }}
          WAVE_MODE: ${{ steps.wave.outputs.mode }}
          SCOUT_TIER: ${{ steps.wave.outputs.tier }}
          SCOUT_LIMIT: ${{ steps.wave.outputs.limit }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ -n "${DISPATCH_REPO_URLS}" ]; then
            python3 scripts/seo_pipeline.py --repo-urls "${DISPATCH_REPO_URLS}" --force-provider "${FORCE_PROVIDER}" --min-delay 4.1
          elif [ -n "${DISPATCH_REPO_URL}" ]; then
            python3 scripts/seo_pipeline.py --single-repo "${DISPATCH_REPO_URL}" --force-provider "${FORCE_PROVIDER}" --min-delay 0
          elif [ "${SCOUT_TIER}" = "trending" ]; then
            python3 scripts/seo_pipeline.py --tier trending --limit "${SCOUT_LIMIT}" --force-provider "${FORCE_PROVIDER}" --batch-commit-size 50 --min-delay 4.1
          else
            python3 - <<'PY'
          import json, os, sys
          from datetime import datetime, timezone
          from pathlib import Path

          sys.path.insert(0, "scripts")
          from recover_quota_waves import compute_catalog_status, execute_streaming_recovery

          event_name = os.environ.get("EVENT_NAME", "")
          tier = os.environ.get("SCOUT_TIER", "all").strip() or "all"
          raw_limit = max(0, int(os.environ.get("SCOUT_LIMIT") or "250"))
          force_provider = os.environ.get("FORCE_PROVIDER", "auto").strip() or "auto"

          effective_limit = raw_limit
          quota_path = Path("data/daily_quota_state.json")
          if event_name == "schedule" and quota_path.exists():
              state = json.loads(quota_path.read_text(encoding="utf-8"))
              today = datetime.now(timezone.utc).date().isoformat()
              if state.get("date_utc") == today:
                  rem_today = max(0, 1000 - int(state.get("total_generated_today", 0)))
                  effective_limit = min(raw_limit, rem_today)

          if effective_limit <= 0:
              print("Daily quota (1,000/day) already satisfied for today UTC; preserving 500 RPD headroom.")
              sys.exit(0)

          if tier == "tier1":
              t1, t2, t3 = effective_limit, 0, 0
          elif tier == "tier2":
              t1, t2, t3 = 0, effective_limit, 0
          elif tier == "tier3":
              t1, t2, t3 = 0, 0, effective_limit
          else:
              status = compute_catalog_status()
              deltas = status.get("remaining_deltas", {})
              d1 = max(0, int(deltas.get("tier1_gui", 0)))
              d2 = max(0, int(deltas.get("tier2_webapp", 0)))
              d3 = max(0, int(deltas.get("tier3_powertool", 0)))
              total_delta = d1 + d2 + d3
              if total_delta <= 0:
                  # Balanced 50/30/20 wave split even after catalog reaches 1,000
                  t1 = int(round(effective_limit * 0.50))
                  t2 = int(round(effective_limit * 0.30))
                  t3 = max(0, effective_limit - t1 - t2)
              else:
                  t1 = min(d1, int(round(effective_limit * (d1 / total_delta))))
                  t2 = min(d2, int(round(effective_limit * (d2 / total_delta))))
                  t3 = min(d3, max(0, effective_limit - t1 - t2))
                  leftover = effective_limit - (t1 + t2 + t3)
                  if leftover > 0 and d1 > t1:
                      add = min(leftover, d1 - t1)
                      t1 += add
                      leftover -= add
                  if leftover > 0 and d2 > t2:
                      add = min(leftover, d2 - t2)
                      t2 += add
                      leftover -= add
                  if leftover > 0 and d3 > t3:
                      t3 += min(leftover, d3 - t3)

          print(f"[WAVE PLAN] mode={os.environ.get('WAVE_MODE')} tier={tier} -> tier1={t1}, tier2={t2}, tier3={t3}")
          res = execute_streaming_recovery(
              tier1_target=t1,
              tier2_target=t2,
              tier3_target=t3,
              min_delay=4.1,
              batch_commit_size=50,
              commit_batches=False,
              force_provider=force_provider,
              max_runtime_seconds=4500.0,
          )
          print("[WAVE RESULT]", json.dumps(res))
          PY
          fi
          python3 scripts/cluster_orchestrator.py --generate-all
          python3 scripts/generate_catalog_index.py

      - name: Validate all Markdown cards
        run: python3 scripts/validator_sanitizer.py --check-all

      - name: Commit and push remaining batch cards
        run: |
          git add content/apps content/guides content/bundles public/icons public/catalog-index.json data/catalog-index.json data/clusters_manifest.json src/data/app_cluster_map.json data/retry_queue.json data/processed_repos.json data/daily_quota_state.json public/llms.txt public/llms-full.txt public/catalog-rag.txt public/codebase-full.txt public/api/catalog.json public/api/clusters.json
          if git diff --cached --quiet; then
            echo "No remaining un-committed cards."
          else
            git commit -m "chore(seo): update HubHum app cards and catalog index"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              git merge -X ours --no-edit origin/main
              python3 scripts/generate_catalog_index.py
              git add public/catalog-index.json data/catalog-index.json public/llms.txt public/llms-full.txt public/catalog-rag.txt public/codebase-full.txt public/api/catalog.json public/api/clusters.json
              git commit --amend --no-edit
            fi
            git push origin main
          fi

      - name: Comment and close translation Issue on completion
        if: github.event_name == 'issues' && steps.extract.outputs.slug != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          APP_SLUG: ${{ steps.extract.outputs.slug }}
        run: |
          gh issue comment "${ISSUE_NUMBER}" --body "App successfully translated! Available at: https://davanzokeoma.github.io/HubHum/apps/${APP_SLUG}/"
          gh issue close "${ISSUE_NUMBER}" --reason completed
